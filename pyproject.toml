[project]
name = "mycodemo"
version = "0.0.1"
description = "Mycelium Growth & Property Planner: demo of growth forecast, image tracking and property estimate for mycelium composites"
authors = [
  { name = "Sylas_Lau" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "opencv-python-headless>=5.0.0.93",
    "pandas",
    "pillow",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "scipy",
    "seaborn>=0.13.2",
    "statsmodels",
    "streamlit",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycodemo"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]

